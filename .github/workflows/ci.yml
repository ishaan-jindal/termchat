name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod is tidy
        run: |
          if ! go mod tidy -diff > /tmp/tidy.diff 2>&1; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            cat /tmp/tidy.diff
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race ./...

  cross-compile:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: linux
            arch: 386
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
          - os: android
            arch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile all binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 go build -o /tmp/cli${{ matrix.ext }} ./cli
          CGO_ENABLED=0 go build -o /tmp/server${{ matrix.ext }} ./server/cmd/server
          CGO_ENABLED=0 go build -o /tmp/api${{ matrix.ext }} ./api

  # Single check that depends on every other job. Branch protection on main
  # requires `lint-and-test` and `verify` by name; if the matrix grows, this
  # requirement does not need updating.
  verify:
    runs-on: ubuntu-latest
    needs: [lint-and-test, cross-compile]

    steps:
      - name: All required checks passed
        run: echo "All required checks passed"
