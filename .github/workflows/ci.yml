name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Format and test as separate checks; fuzzing waits for both.
  gate:
    uses: ./.github/workflows/gate.yml

  fuzz:
    runs-on: ubuntu-latest
    needs: gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz (bounded)
        run: |
          go test -fuzz=FuzzSanitizeInput -fuzztime=15s ./server/
          go test -fuzz=FuzzTruncateRunes -fuzztime=15s ./server/
          go test -fuzz=FuzzRoomCodeValidation -fuzztime=15s ./shared/
          go test -fuzz=FuzzParseArgs -fuzztime=15s ./cli/
