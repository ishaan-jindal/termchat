name: CLI Release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cli-v0.4.3). Uses the tag to build, version, and publish."
        required: true

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # Verify, lint, and test the tagged code before building any release
  # binaries.
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  binaries:
    runs-on: ubuntu-latest
    needs: gate

    strategy:
      max-parallel: 4

      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: linux
            arch: 386
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
          - os: android
            arch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist

          CGO_ENABLED=0 go build \
          -ldflags "\
          -s -w \
          -X main.Version=${VERSION} \
          -X main.DefaultWS=${{ vars.TERMCHAT_WS_URL }}" \
          -o dist/termchat-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
          ./cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/termchat-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: binaries

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            cli-v*) ;;
            *) echo "::error::Tag must start with cli-v (got $TAG)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum termchat-* > termchat-checksums.txt
          ls -la
          cat termchat-checksums.txt

      - name: Extract changelog entry
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          python3 -c "
          import re, sys
          tag = sys.argv[1]
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = rf'(##\s*\[{re.escape(tag)}\].*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  section = match.group(1).strip()
                  lines = section.split('\n')
                  if lines[0].startswith('## '):
                      section = '\n'.join(lines[1:]).strip()
                  with open('release_notes.md', 'w') as out:
                      out.write(section)
              else:
                  with open('release_notes.md', 'w') as out:
                      out.write('Release ' + tag)
          except Exception:
              with open('release_notes.md', 'w') as out:
                  out.write('Release ' + tag)
          " "$TAG"

      - name: Create or update release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if ! gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            dist/*; then
            echo "Release $TAG may already exist; uploading assets to it..."
            gh release upload "$TAG" dist/* --clobber
          fi

          gh release view "$TAG" --json tagName,assets --jq '.tagName + " has " + (.assets | length | tostring) + " assets"'

  aur-publish:
    needs: release
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # GHCR image build, gated behind the release (no standalone tag trigger).
  websocket-publish:
    needs: release
    uses: ./.github/workflows/websocket.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # npm publish, gated behind the release (no standalone tag trigger).
  # Chained via workflow_call so the OIDC workflow_ref resolves to cli.yml;
  # the 8 @sacredcat/termchat* trusted publishers must be registered against
  # cli.yml, not npm.yml.
  npm-publish:
    needs: release
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
