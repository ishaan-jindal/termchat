name: WebSocket Image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cli-v2.1.0)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: websocket-image
  cancel-in-progress: false

jobs:

  docker:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push websocket image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/termchat-websocket:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}/termchat-websocket:latest
            ghcr.io/${{ github.repository }}/termchat-websocket:${{ github.sha }}
