name: API Image

on:
  push:
    branches:
      - main

    paths:
      - "api/**"
      - "shared/**"
      - "scripts/**"
      - "Dockerfile.api"
      - ".dockerignore"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api-image
  cancel-in-progress: true

jobs:

  docker:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/termchat-api:latest
            ghcr.io/${{ github.repository }}/termchat-api:${{ github.sha }}
